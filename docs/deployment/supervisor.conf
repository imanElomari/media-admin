# Supervisor configuration for Postiz/Media Admin
# Place this file in /etc/supervisor/conf.d/postiz.conf on your server
# Adjust the paths and settings according to your deployment

[program:postiz-backend]
command=/usr/bin/pnpm --filter ./apps/backend run start
directory=/path/to/your/deployment
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postiz-backend.log
stderr_logfile=/var/log/supervisor/postiz-backend-error.log
environment=NODE_ENV="production",PATH="/usr/bin:/usr/local/bin"

[program:postiz-frontend]
command=/usr/bin/pnpm --filter ./apps/frontend run start
directory=/path/to/your/deployment
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postiz-frontend.log
stderr_logfile=/var/log/supervisor/postiz-frontend-error.log
environment=NODE_ENV="production",PATH="/usr/bin:/usr/local/bin"

[program:postiz-workers]
command=/usr/bin/pnpm --filter ./apps/workers run start
directory=/path/to/your/deployment
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postiz-workers.log
stderr_logfile=/var/log/supervisor/postiz-workers-error.log
environment=NODE_ENV="production",PATH="/usr/bin:/usr/local/bin"

[program:postiz-cron]
command=/usr/bin/pnpm --filter ./apps/cron run start
directory=/path/to/your/deployment
user=www-data
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/postiz-cron.log
stderr_logfile=/var/log/supervisor/postiz-cron-error.log
environment=NODE_ENV="production",PATH="/usr/bin:/usr/local/bin"

[group:postiz]
programs=postiz-backend,postiz-frontend,postiz-workers,postiz-cron
priority=999
