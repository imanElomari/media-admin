---
name: "Deploy to Server via SSH"

"on":
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.1

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm run prisma-generate

      - name: Build applications
        run: pnpm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Build status
        run: |
          echo "✅ Build completed successfully"
          echo "BUILD_STATUS=success" >> $GITHUB_ENV

  deploy:
    name: Deploy to Remote Server
    needs: build
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} \
            -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection successful'"

      - name: Sync codebase to remote server
        run: |
          DEPLOY_TARGET="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"
          DEPLOY_TARGET="${DEPLOY_TARGET}:${{ secrets.DEPLOY_PATH }}/"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT || 22 }} \
              -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude '.env' \
            --exclude 'uploads' \
            --exclude 'var' \
            ./ "${DEPLOY_TARGET}"

      - name: Deploy on remote server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📦 Installing dependencies..."
            pnpm install --frozen-lockfile

            echo "🔨 Generating Prisma client..."
            pnpm run prisma-generate

            echo "🏗️ Building application..."
            NODE_OPTIONS="--max-old-space-size=4096" pnpm run build

            echo "🔄 Restarting Supervisor service..."
            sudo supervisorctl restart \
              ${{ secrets.SUPERVISOR_SERVICE_NAME }} || \
              sudo supervisorctl start \
              ${{ secrets.SUPERVISOR_SERVICE_NAME }}

            echo "✅ Deployment completed successfully"
          ENDSSH

      - name: Check deployment status
        id: check_deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Checking Supervisor service status..."
            SERVICE_STATUS=$(sudo supervisorctl status \
              ${{ secrets.SUPERVISOR_SERVICE_NAME }} | awk '{print $2}')
            echo "SERVICE_STATUS=$SERVICE_STATUS" >> $GITHUB_OUTPUT

            if [ "$SERVICE_STATUS" = "RUNNING" ]; then
              echo "✅ Service is running"
              echo "DEPLOYMENT_STATE=success" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "❌ Service is not running: $SERVICE_STATUS"
              echo "DEPLOYMENT_STATE=failed" >> $GITHUB_OUTPUT
              exit 1
            fi
          ENDSSH

      - name: Deployment Summary
        if: always()
        run: |
          STATE="${{ steps.check_deployment.outputs.DEPLOYMENT_STATE }}"
          if [ "$STATE" = "success" ]; then
            echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Server:** ${{ secrets.SSH_HOST }}" \
              >> $GITHUB_STEP_SUMMARY
            echo "**Service Status:** RUNNING" >> $GITHUB_STEP_SUMMARY
            echo "**Deployed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
              >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Server:** ${{ secrets.SSH_HOST }}" \
              >> $GITHUB_STEP_SUMMARY
            echo "**Service Status:** NOT RUNNING" \
              >> $GITHUB_STEP_SUMMARY
            echo "**Failed at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" \
              >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
