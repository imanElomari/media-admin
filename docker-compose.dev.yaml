services:
  # --- PostgreSQL Database ---
  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    environment:
      POSTGRES_USER: media_admin
      POSTGRES_PASSWORD: admin1234!
      POSTGRES_DB: media_db
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media_admin -d media_db"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Redis ---
  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # --- Postiz App (Single image, multiple instances) ---
  postiz-atlasimex:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: postiz-app:latest
    container_name: postiz-atlasimex
    restart: always
    env_file:
      - .env.atlasimex
    networks:
      - postiz-network
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-promax:
    image: postiz-app:latest
    container_name: postiz-promax
    restart: always
    env_file:
      - .env.promax
    networks:
      - postiz-network
    depends_on:
      - postiz-postgres
      - postiz-redis

  postiz-x6drinks:
    image: postiz-app:latest
    container_name: postiz-x6drinks
    restart: always
    env_file:
      - .env.x6drinks
    networks:
      - postiz-network
    depends_on:
      - postiz-postgres
      - postiz-redis

  # --- Caddy Reverse Proxy ---
  caddy:
    image: caddy:2
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile
    networks:
      - postiz-network

# --- Volumes ---
volumes:
  postgres-volume:
  postiz-redis-data:
  caddy-data:
  caddy-config:

# --- Network ---
networks:
  postiz-network:
    driver: bridge
